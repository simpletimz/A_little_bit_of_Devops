services:
  web:
    build: .
    container_name: portfolio-container
    ports:
      - "8080:80"
    networks:
      - portfolio-net
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: portfolio-db
    environment:
    # manage your secrets wisely. Secrets such as postgrespassword should not be plaintext here
    # you can create a secret file and reference it here
    # this password is just for testing and practice
      POSTGRES_PASSWORD: changeme123
      POSTGRES_DB: portfoliodb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - portfolio-net

networks:
  portfolio-net:
    driver: bridge

volumes:
  pgdata:
