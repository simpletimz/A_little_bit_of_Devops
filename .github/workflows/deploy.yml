name: Build, Scan, and Push Portfolio Site

on:
  push:
    branches: [main]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t portfolio-site:${{ github.sha }} project-2-docker-compose/

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: portfolio-site:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Log in to Docker Hub
        if: success()
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: success()
        run: |
          docker tag portfolio-site:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-site:${{ github.sha }}
          docker tag portfolio-site:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-site:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-site:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-site:latest

      - name: Configure AWS credentials
        if: success()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy via SSM
        if: success()
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-site:latest",
              "docker stop portfolio-container || true",
              "docker rm portfolio-container || true",
              "docker run -d --name portfolio-container -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-site:latest"
            ]' \
            --region us-east-1