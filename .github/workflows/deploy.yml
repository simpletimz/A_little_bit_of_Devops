name: Build, Scan, and Push Portfolio Site

on:
  push:
    branches: [main]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t portfolio-site:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: portfolio-site:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Log in to Docker Hub
        if: success()
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: success()
        run: |
          docker tag portfolio-site:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-site:${{ github.sha }}
          docker tag portfolio-site:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-site:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-site:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-site:latest